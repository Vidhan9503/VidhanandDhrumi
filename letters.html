<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Open When ♡</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/fit.css"><link rel="stylesheet" href="assets/css/letters.css"></head><body class="lt-body"><nav class="nav"><a class="logo" href="index.html">V&amp;D</a><div class="nav-links"><a href="index.html">home</a><a href="scrapbook.html">scrapbook</a><a href="cinema.html">movie</a><a href="letters.html">letters</a><button id="lockNow" class="nav-lock" type="button">lock ♡</button></div></nav><main class="lt-shell"><header class="lt-hero"><p class="eyebrow">from my side of the distance</p><h1>open <em>when...</em></h1><p>Little envelopes for the days I can't be there in person. Pick the one that matches your mood.</p></header><div class="lt-tools"><input class="lt-search" id="search" type="search" placeholder="search a feeling…"><button class="lt-add" id="newLetter">＋ write a new letter</button></div><p class="lt-count" id="count"></p><section class="lt-grid" id="letters"></section></main><div class="lt-modal" id="read" aria-hidden="true"><div class="lt-card lt-paper"><button class="lt-x" data-close="read">×</button><div class="lt-read-emoji" id="rEmoji">💌</div><p class="eyebrow" id="rTrigger"></p><h2 id="rTitle"></h2><div class="lt-body-text" id="rBody"></div><span class="lt-sign">love, your favourite person ♡</span></div></div><div class="lt-modal" id="edit" aria-hidden="true"><div class="lt-card lt-sheet"><button class="lt-x" data-close="edit">×</button><p class="eyebrow">make another little envelope</p><h2>write a <em>letter.</em></h2><form id="letterForm" class="lt-form"><label>Title<input name="title" required maxlength="200"></label><label>When should she open it?<input name="trigger" required maxlength="200"></label><div class="lt-row"><label>Emoji<input name="emoji" value="💌"></label><label>Unlock date<input name="unlock_date" type="date"></label></div><label>Locked message<input name="locked_message" value="Not yet, impatient human."></label><label>Your letter<textarea name="content" required></textarea></label><button class="lt-save">seal this letter ♡</button></form></div></div><footer><span>sealed with a kiss</span><span>do not read all at once</span><span>♡</span></footer><script src="app.js"></script></body></html>
